    return PDFLIB.catch(function(e){PDFLIB=null;throw e});
  }
  function getProfil(){
    var p={};
    try{var o=(JSON.parse(localStorage.getItem('pustakago-data'))||{}).profil;if(o&&o.nama)p={nama_perpustakaan:o.nama,alamat:o.alamat,email:o.email,tlp:o.tlp}}catch(e){}
    try{Object.assign(p,JSON.parse(localStorage.getItem('pustakago-profil'))||{})}catch(e){}
    return fetch(SB+'profil_perpustakaan?select=*&order=created_at.asc&limit=1',{headers:HD})
      .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
      .then(function(rows){var r=rows&&rows[0]||{};Object.keys(r).forEach(function(k){if(r[k]!=null&&String(r[k]).trim()!=='')p[k]=r[k]});return p})
      .catch(function(){return p});
  }
  function loadLogo(u){
    return new Promise(function(res){
      if(!u)return res(null);
      var done=false,fin=function(v){if(!done){done=true;res(v)}},im=new Image();
      setTimeout(function(){fin(null)},5000);
      im.crossOrigin='anonymous';
      im.onload=function(){try{var c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext('2d').drawImage(im,0,0);fin({d:c.toDataURL('image/png'),w:c.width,h:c.height})}catch(e){fin(null)}};
      im.onerror=function(){fin(null)};
      im.src=u;
    });
  }
  function drawKop(doc,p,logo,W,M){
    var LW=24,tw=W-2*(M+LW+4),cx=W/2,top=M,y=top;
    var items=[{t:(p.nama_perpustakaan||'Perpustakaan Sekolah').toUpperCase(),s:15,b:1}];
    if(p.nama_sekolah)items.push({t:String(p.nama_sekolah),s:11.5,b:1});
    var ids=[p.npsn?'NPSN: '+p.npsn:'',p.nomor_pendirian?'No. Pendirian: '+p.nomor_pendirian:''].filter(Boolean).join('   |   ');
    if(ids)items.push({t:ids,s:9});
    if(p.alamat)items.push({t:String(p.alamat),s:9});
    var ct=[p.tlp?'Telp. '+p.tlp:'',p.email?'Email: '+p.email:''].filter(Boolean).join('   |   ');
    if(ct)items.push({t:ct,s:9});
    doc.setTextColor(14,42,33);
    items.forEach(function(it){
      doc.setFont('helvetica',it.b?'bold':'normal');doc.setFontSize(it.s);
      doc.splitTextToSize(it.t,tw).forEach(function(ln){y+=it.s*0.3528*1.3;doc.text(ln,cx,y,{align:'center'})});
      y+=0.8;
    });
    var bh=Math.max(y-top,logo?LW:0);
    if(logo){
      var sc=Math.min(LW/logo.w,LW/logo.h),iw=logo.w*sc,ih=logo.h*sc;
      try{doc.addImage(logo.d,'PNG',M+(LW-iw)/2,top+(bh-ih)/2,iw,ih)}catch(e){}
    }
    var ly=top+bh+2;
    doc.setDrawColor(14,42,33);doc.setLineWidth(.9);doc.line(M,ly,W-M,ly);
    doc.setLineWidth(.25);doc.line(M,ly+1.3,W-M,ly+1.3);
    return ly+9;
  }
  var nat=function(a,b){return String(a).localeCompare(String(b),'id',{numeric:true})};
  var PH=['ID','Kode Inv.','Kode Kat.','Deskripsi Kategori','Judul Buku','ISBN','Pengarang','Penerbit','Tahun','Sumber Anggaran','Jml','Kondisi','Lokasi','Status','Pinjam','Stok'];
  var PR=function(b){return[b.id_buku,b.kode_inventaris,b.kode_kategori,b.deskripsi_kategori,b.judul,b.isbn,b.pengarang,b.penerbit,b.tahun_terbit,b.sumber_anggaran,b.jumlah_buku,b.kondisi,b.lokasi_simpan,b.status_peminjaman,b.jumlah_terpinjam,b.on_stok]};
  var classOf=function(b){var c=String(b.kode_kategori||'').trim().charAt(0);return/\d/.test(c)?c+'00':'-'};
  function className(k){var d=DW.filter(function(x){return x[0]===k})[0];return k==='-'?'Tanpa Kategori':k+' - '+(d?d[1]:'')}
  function sorted(l){return l.slice().sort(function(a,b){return nat(a.kode_kategori||'',b.kode_kategori||'')||nat(a.judul||'',b.judul||'')})}
  function fileDate(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
  function buildPdf(scope,val,p,logo){
    var J=window.jspdf.jsPDF,doc=new J({orientation:'landscape',unit:'mm',format:'a4'});
    var W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight(),M=12,y=drawKop(doc,p,logo,W,M);
    var list=sorted(B),label,tag;
    if(scope==='kategori'&&val)list=list.filter(function(b){return classOf(b)===val});
    if(scope==='kondisi'&&val)list=list.filter(function(b){return b.kondisi===val});
    label=scope==='all'?'Semua Buku':scope==='kategori'?(val?'Kategori '+className(val):'Per Kategori Dewey'):(val?'Kondisi '+val:'Per Kondisi');
    tag=scope==='all'?'Semua':scope==='kategori'?(val?'Kategori-'+val:'Per-Kategori'):(val?'Kondisi-'+val:'Per-Kondisi');
    var fname=('Daftar-Buku-'+tag+'-'+fileDate()+'.pdf').replace(/[^A-Za-z0-9._-]+/g,'-');

    doc.setTextColor(14,42,33);doc.setFont('helvetica','bold');doc.setFontSize(13);
    doc.text('DAFTAR BUKU PERPUSTAKAAN',W/2,y,{align:'center'});y+=6;
    doc.setFontSize(11);doc.text(label,W/2,y,{align:'center'});y+=5.5;
    var meta=[p.tahun_pelajaran?'Tahun Pelajaran '+p.tahun_pelajaran:'',p.semester?'Semester '+p.semester:'',
      'Dicetak '+new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})].filter(Boolean).join('   |   ');
    doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(95,111,103);doc.text(meta,W/2,y,{align:'center'});y+=7;
    var eks=list.reduce(function(a,b){return a+(+b.jumlah_buku||0)},0),kd=function(k){return list.filter(function(b){return b.kondisi===k}).length};
    doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(14,42,33);
    doc.text('Total: '+list.length+' judul, '+eks+' eksemplar   (Baik '+kd('Baik')+', Rusak '+kd('Rusak')+', Hilang '+kd('Hilang')+')',M,y);y+=5;

    function section(title,rows){
      if(title){
        if(y>H-40){doc.addPage();y=M}
        doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(14,42,33);doc.text(title,M,y);y+=3;
      }
      var dash=function(v){return v==null||String(v).trim()===''?'-':String(v)};
      doc.autoTable({
        startY:y,margin:{left:M,right:M,bottom:16},theme:'grid',
        head:[['No'].concat(PH)],
        body:rows.map(function(b,i){return[String(i+1)].concat(PR(b).map(dash))}),
        styles:{fontSize:7,cellPadding:1.4,lineColor:[200,205,200],lineWidth:.2,textColor:[22,37,31],overflow:'linebreak',valign:'middle'},
        headStyles:{fillColor:[31,107,79],textColor:255,fontStyle:'bold'},
        alternateRowStyles:{fillColor:[246,249,246]},
        columnStyles:{0:{cellWidth:8,halign:'center'},1:{cellWidth:14},9:{cellWidth:10,halign:'center'},11:{cellWidth:10,halign:'center'},12:{cellWidth:14},15:{cellWidth:12,halign:'center'},16:{cellWidth:10,halign:'center'}}
      });
      y=doc.lastAutoTable.finalY+8;
    }
    if(scope==='kategori'){
      var g={};list.forEach(function(b){var k=classOf(b);(g[k]=g[k]||[]).push(b)});
      Object.keys(g).sort(nat).forEach(function(k){section(className(k)+' ('+g[k].length+' judul)',g[k])});
    }else if(scope==='kondisi'&&!val){
      ['Baik','Rusak','Hilang'].forEach(function(k){var l=list.filter(function(b){return b.kondisi===k});if(l.length)section('Kondisi '+k+' ('+l.length+' judul)',l)});
    }else section('',list);
    var n=doc.getNumberOfPages();
    for(var i=1;i<=n;i++){
      doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(120,130,125);
      doc.text('Halaman '+i+' dari '+n,W-M,H-8,{align:'right'});
      doc.text('Daftar Buku - '+(p.nama_perpustakaan||'Perpustakaan'),M,H-8);
    }
    return{doc:doc,name:fname};
  }

  function exportModal(){
    var ks={};B.forEach(function(b){ks[classOf(b)]=1});ks=Object.keys(ks).sort(nat);
    var n=B.length,rows=[
      ['all','Semua Buku',n+' judul dalam satu tabel','book','linear-gradient(160deg,#2f8a67,#0e2a21)'],
      ['kategori','Per Kategori Dewey','dikelompokkan menurut kelas Dewey','tag','linear-gradient(160deg,#f0c877,#c98a1f)'],
      ['kondisi','Per Kondisi','Baik, Rusak, atau Hilang','ok','linear-gradient(160deg,#7f9fe0,#3a5ca8)']];
    var h='<h2 id="fmTitle">Export PDF</h2><p class="xsub">Pilih bagian buku yang akan diexport. Kop surat diambil dari Profil Perpustakaan.</p><div class="xlist">';
    rows.forEach(function(r){
      h+='<button type="button" class="xopt" data-x="'+r[0]+'"'+(n?'':' disabled')+'><span class="ic" style="background:'+r[4]+'">'+svg(r[3])+'</span><span class="xt"><b>'+esc(r[1])+'</b><small>'+(n?esc(r[2]):'Belum ada data')+'</small></span><span class="xgo">PDF</span></button>';
      if(n&&r[0]==='kategori')h+='<div class="f xsel"><label for="xKat">Pilih kategori</label><select id="xKat"><option value="">Semua Kategori</option>'+ks.map(function(k){return'<option value="'+esc(k)+'">'+esc(className(k))+'</option>'}).join('')+'</select></div>';
      if(n&&r[0]==='kondisi')h+='<div class="f xsel"><label for="xKon">Pilih kondisi</label><select id="xKon"><option value="">Semua Kondisi</option><option>Baik</option><option>Rusak</option><option>Hilang</option></select></div>';
    });
    h+='</div><div class="acts"><button type="button" class="btn alt" id="fx">Tutup</button></div>';
    var fm=$('#fm');fm.innerHTML=h;$('#ov').classList.add('on');
    $('#fx').onclick=closeForm;fm.onsubmit=function(e){e.preventDefault()};
    var busy=false;
    fm.onclick=function(e){
      var b=e.target.closest('.xopt');if(!b||b.disabled||busy)return;
      var sc=b.dataset.x,val=sc==='kategori'?$('#xKat').value:sc==='kondisi'?$('#xKon').value:'',go=b.querySelector('.xgo'),old=go.textContent;
      busy=true;fm.querySelectorAll('.xopt').forEach(function(x){x.disabled=true});go.textContent='Menyiapkan…';
      Promise.all([loadPdfLib(),getProfil()]).then(function(r){
        return loadLogo(r[1].logo).then(function(logo){
          var out=buildPdf(sc,val,r[1],logo);
          out.doc.save(out.name);
          toast('PDF berhasil dibuat'+(r[1].nama_perpustakaan?'':'. Profil perpustakaan belum diisi, kop memakai teks bawaan')+'.');
          closeForm();
        });
      }).catch(function(e){toast('Gagal membuat PDF ('+(e&&e.message||'kesalahan')+').');
        busy=false;fm.querySelectorAll('.xopt').forEach(function(x){x.disabled=false});go.textContent=old});
    };
  }
  $('#dExport').addEventListener('click',exportModal);

  /* ===== NAVIGASI ===== */
  $('#home').addEventListener('click',function(){location.href='adminpustakawan.html'});
  $('#dBeranda').addEventListener('click',function(){location.href='adminpustakawan.html'});
  try{var u=JSON.parse(sessionStorage.getItem('pustakago_user')),n=u&&(u.nama||u.username);if(n){$('#who').textContent=n;$('#av').textContent=n.trim().split(/\s+/).slice(0,2).map(function(w){return w[0]}).join('').toUpperCase()}}catch(e){}
  try{var pf=JSON.parse(localStorage.getItem('pustakago-profil'));if(pf&&pf.nama_perpustakaan)$('#navName').textContent=pf.nama_perpustakaan}catch(e){}

  render();
  pull(0,[]).then(function(rows){B=rows;cache();render()}).catch(function(e){toast(errMsg(e)+' Menampilkan data tersimpan di browser.')});
})();
</script>
