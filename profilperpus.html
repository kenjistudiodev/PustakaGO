<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profil Perpustakaan — PustakaGO</title>
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --serif:ui-serif,"New York","Iowan Old Style",Georgia,serif;
  --ink:#16251f;--muted:#5f6f67;--green:#1f6b4f;--green2:#2f8a67;--deep:#0e2a21;--gold:#d4a24c;--wine:#7a2e3a;
  --line:rgba(0,0,0,.09);--track:rgba(120,120,128,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom));
  background:radial-gradient(70% 55% at 12% 10%,#2f8a67 0,transparent 65%),radial-gradient(60% 50% at 90% 20%,#8a6a2c 0,transparent 65%),radial-gradient(70% 60% at 60% 100%,#0b1f18 0,transparent 70%),#123a2c;background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid rgba(212,162,76,.8);outline-offset:2px;border-radius:10px}

/* Navbar */
.nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));color:#fff;
  background:rgba(10,30,22,.6);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-bottom:.5px solid rgba(255,255,255,.1)}
button.brand{text-align:left;color:#fff}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,var(--green2),var(--deep));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 6px rgba(0,0,0,.3)}
.logo svg{width:20px;height:20px}
.nm{line-height:1.2;min-width:0}.nm b,.nm small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nm b{display:block;font-size:14px;font-weight:700}.nm small{display:block;font-size:11px;opacity:.75}
.sp{flex:1}
.acct{display:flex;align-items:center;gap:10px;padding:4px 6px 4px 12px;border-radius:99px;background:rgba(255,255,255,.14)}
.acct div{text-align:right;line-height:1.2}.acct b{display:block;font-size:13px}.acct small{font-size:11px;opacity:.75}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#2a1c05;background:linear-gradient(160deg,#f0c877,var(--gold))}

/* Layout */
.wrap{max-width:820px;margin:0 auto;padding:22px 10px}
.head{margin-bottom:18px;color:#fff}
h1{font-family:var(--serif);font-size:clamp(28px,4.5vw,38px);letter-spacing:-.02em;line-height:1.1}
.head p{opacity:.8;font-size:14px;margin-top:4px}
.panel{background:rgba(246,241,228,.93);backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.28),0 0 0 .5px rgba(0,0,0,.14)}
.box{padding:18px;margin-bottom:16px}.box h2{font-size:17px;margin-bottom:4px}
.box .sub{color:var(--muted);font-size:13px;margin-bottom:14px}

/* Form */
.g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.g>*{min-width:0}
.f{margin-bottom:12px}.f.full{grid-column:1/-1}
.f label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 4px 2px}
.f label i{font-style:normal;color:var(--wine)}
.f input,.f select{width:100%;height:40px;padding:0 12px;border-radius:10px;border:1px solid rgba(0,0,0,.15);background:#fff;outline:none}
.f input:focus,.f select:focus{border-color:var(--green2);box-shadow:0 0 0 4px rgba(47,138,103,.25)}
.f [aria-invalid="true"]{border-color:var(--wine);box-shadow:0 0 0 3px rgba(122,46,58,.18)}
.f input[readonly]{background:rgba(255,255,255,.55);color:#3d4d45;cursor:default}
.srcrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;font-size:13px;color:var(--muted)}
.srcrow span{flex:1;min-width:0}
.btn[disabled]{opacity:.55;cursor:default}.d[disabled]{opacity:.55}
.err{display:block;min-height:0;font-size:12px;color:var(--wine);margin:3px 0 0 2px}
.pw{position:relative}.pw input{padding-right:78px}
.pw button{position:absolute;right:4px;top:4px;height:32px;padding:0 10px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--green);background:rgba(47,138,103,.12)}

.btn{all:unset;box-sizing:border-box;cursor:pointer;height:40px;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;font-size:14px;font-weight:600;color:#fff;background:linear-gradient(var(--green2),var(--green));box-shadow:0 1px 2px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.25)}
.btn:hover{filter:brightness(1.06)}.btn:focus-visible{outline:3px solid rgba(212,162,76,.8)}
.btn.alt{background:rgba(0,0,0,.08);color:var(--ink);box-shadow:none}
.btn.sm{height:32px;padding:0 14px;font-size:13px}

/* Logo */
.logorow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.lg{flex:none;width:96px;height:96px;border-radius:18px;background:#fff;border:1.5px dashed rgba(0,0,0,.25);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:12px;text-align:center}
.lg img{width:100%;height:100%;object-fit:contain}
.lgact{display:flex;gap:8px;flex-wrap:wrap;min-width:0}
.hint{flex-basis:100%;color:var(--muted);font-size:12.5px}
input[type=file]{display:none}

/* Dock footer */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.84);backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);border-top:.5px solid rgba(0,0,0,.1);box-shadow:0 -4px 20px rgba(0,0,0,.18)}
.dock nav{width:100%;display:flex;justify-content:flex-start;gap:6px;padding:8px 10px;overflow-x:auto}
.dock nav>:first-child{margin-left:auto}.dock nav>:last-child{margin-right:auto}
.d{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:84px;padding:8px 14px;border-radius:16px;font-size:12px;font-weight:600;color:var(--ink);transition:background .15s,transform .15s}
.d:hover{background:var(--track);transform:translateY(-3px)}
.d .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#fff;box-shadow:0 3px 8px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.35)}
.d .ic svg{width:21px;height:21px}

.toast{max-width:calc(100% - 20px);text-align:center;position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--deep);color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:70}
.toast.on{opacity:1}

@media (max-width:620px){.g{grid-template-columns:minmax(0,1fr)}.acct div{display:none}.acct{padding:3px}.nm small{display:none}.d{min-width:76px;padding:8px 10px}.wrap{padding:16px 10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="nav">
  <button class="brand" id="home" type="button" aria-label="Ke beranda pustakawan">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h6a2 2 0 0 1 2 2v14a3 3 0 0 0-3-3H4V4zm16 0h-6a2 2 0 0 0-2 2v14a3 3 0 0 1 3-3h5V4z"/></svg></span>
    <span class="nm"><b id="navName">PustakaGO</b><small>Profil Perpustakaan</small></span>
  </button>
  <span class="sp"></span>
  <div class="acct" aria-label="Akun masuk"><div><b id="who">Pustakawan</b><small>Pustakawan</small></div><span class="avatar" id="av">P</span></div>
</header>

<main class="wrap">
  <div class="head"><h1>Profil Perpustakaan</h1><p>Identitas perpustakaan dan akun diisi di sini; data sekolah dan kepala sekolah diambil dari tabel profil. Kolom bertanda <span aria-hidden="true">*</span> wajib diisi.</p></div>
  <form id="fp" novalidate></form>
</main>

<div class="dock">
  <nav aria-label="Menu halaman">
    <button class="d" id="dBeranda" type="button"><span class="ic" style="background:linear-gradient(160deg,#4fb98a,#1f6b4f)" data-i="home"></span>Beranda</button>
    <button class="d" id="dSimpan" type="button"><span class="ic" style="background:linear-gradient(160deg,#f0c877,#c98a1f)" data-i="ok"></span>Simpan</button>
  </nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var P={
    home:'<path d="M3 11l9-7 9 7M5 9.500V20h14V9.500M10 20v-6h4v6"/>',
    ok:'<path d="M5 12l5 5 9-10"/>',
    img:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.800"/><path d="M21 16l-5-5-8 8"/>'
  };
  var svg=function(n){return'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+P[n]+'</svg>'};
  document.querySelectorAll('[data-i]').forEach(function(e){e.innerHTML=svg(e.dataset.i)});
  var esc=function(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('on')},2600)}
  function uuid(){return window.crypto&&crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)})}

  /* ===== LAPISAN DATA =====
     - Identitas Sekolah dan Kepala Sekolah ditarik (hanya baca) dari tabel "profil" lewat pull().
     - Semua data profil disimpan ke tabel "profil_perpustakaan"; logo diunggah ke bucket "aset".
     - localStorage hanya cadangan/cache jika Supabase tidak terjangkau. */
  var SB='https://ncfuynsctxxxqiqbzptp.supabase.co/rest/v1/',
      SU='https://ncfuynsctxxxqiqbzptp.supabase.co/storage/v1/',TB='profil_perpustakaan',logoBlob=null,
      SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jZnV5bnNjdHh4eHFpcWJ6cHRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMzY1MzUsImV4cCI6MjEwMzcxMjUzNX0.Xy-u2FJuRiwhxOKndHe6suVrItHShGY7WM68bTk9VCk',
      HD={apikey:SK,Authorization:'Bearer '+SK};
  var KEY='pustakago-profil',D={};
  function load(){
    try{D=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){D={}}
    if(!D.nama_perpustakaan){ /* profil lama dari adminpustakawan.html */
      try{var o=(JSON.parse(localStorage.getItem('pustakago-data'))||{}).profil;
        if(o&&o.nama)D={nama_perpustakaan:o.nama,alamat:o.alamat||'',email:o.email||'',tlp:o.tlp||''}}catch(e){}
    }
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(D));return true}catch(e){return false}}
  load();

  /* ===== DEFINISI FORM ===== */
  var YA=[['Ganjil','Ganjil'],['Genap','Genap']],ST=[['Negeri','Negeri'],['Swasta','Swasta']];
  var G=[
    {t:'Identitas Perpustakaan',s:'Data resmi perpustakaan sekolah.',f:[
      {k:'nama_perpustakaan',l:'Nama Perpustakaan',req:1,ph:'Contoh: Perpustakaan Cahaya Ilmu'},
      {k:'nomor_pendirian',l:'Nomor Pendirian',ph:'Nomor SK pendirian perpustakaan'}]},
    {t:'Identitas Sekolah',s:'',ro:1,src:1,f:[
      {k:'nama_sekolah',l:'Nama Sekolah',full:1},
      {k:'npsn',l:'NPSN',im:'numeric',max:8,ph:'8 digit',re:/^\d{8}$/,m:'NPSN harus 8 digit angka.'},
      {k:'status',l:'Status',o:ST},
      {k:'semester',l:'Semester',o:YA},
      {k:'tahun_pelajaran',l:'Tahun Pelajaran',ph:'2026/2027',max:9,chk:function(v){var m=/^(\d{4})\/(\d{4})$/.exec(v);return m&&+m[2]===+m[1]+1},m:'Format tahun pelajaran: 2026/2027.'},
      {k:'alamat',l:'Alamat',full:1},
      {k:'email',l:'Email',t:'email',ac:'off',re:/^[^\s@]+@[^\s@]+\.[^\s@]+$/,m:'Format email tidak valid.'},
      {k:'tlp',l:'Telepon',t:'tel',im:'tel',re:/^[0-9+\-\s]{6,20}$/,m:'Nomor telepon tidak valid.'}]},
    {t:'Kepala Sekolah',s:'Diambil dari tabel profil.',ro:1,f:[
      {k:'nama_kepsek',l:'Nama Kepala Sekolah',full:1},
      {k:'nip_kepsek',l:'NIP Kepala Sekolah',im:'numeric',max:18,re:/^\d{8,18}$/,m:'NIP hanya berisi angka (8–18 digit).'}]},
    {t:'Akun Login',s:'Dipakai untuk masuk ke aplikasi.',f:[
      {k:'username',l:'Username',ac:'off'},
      {k:'password',l:'Password',pw:1}]}
  ];
  var ALL=[];G.forEach(function(g){g.f.forEach(function(f){f.ro=g.ro;ALL.push(f)})});

  function field(f){
    var v=D[f.k]!=null?D[f.k]:'',id='p_'+f.k,inp;
    if(f.o&&!f.ro)inp='<select id="'+id+'"><option value="">Pilih…</option>'+f.o.map(function(o){return'<option value="'+esc(o[0])+'"'+(o[0]===v?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')+'</select>';
    else{
      inp='<input id="'+id+'" name="'+f.k+'" type="'+(f.ro?'text':f.pw?'password':f.t||'text')+'" value="'+esc(v)+'"'+(f.ro?' readonly aria-readonly="true"':(f.ph?' placeholder="'+esc(f.ph)+'"':'')+(f.im?' inputmode="'+f.im+'"':'')+(f.max?' maxlength="'+f.max+'"':''))+' autocomplete="'+(f.pw?'new-password':f.ac||'off')+'"'+(f.req?' aria-required="true"':'')+' aria-describedby="e_'+f.k+'">';
      if(f.pw)inp='<div class="pw">'+inp+'<button type="button" id="tgl" aria-label="Tampilkan password" aria-pressed="false">Lihat</button></div>';
    }
    return'<div class="f'+(f.full?' full':'')+'"><label for="'+id+'">'+esc(f.l)+(f.req?' <i aria-hidden="true">*</i>':'')+'</label>'+inp+'<span class="err" id="e_'+f.k+'" role="alert"></span></div>';
  }

  var logo=D.logo||'';
  function logoBox(){
    return'<article class="panel box"><h2>Logo</h2><p class="sub">Dipakai pada identitas perpustakaan. Format PNG atau JPG.</p>'
      +'<div class="logorow"><div class="lg" id="lgPrev"></div><div class="lgact"><label class="btn alt sm" for="lgFile" tabindex="0" id="lgPick">Pilih gambar</label><button type="button" class="btn alt sm" id="lgDel">Hapus logo</button></div>'
      +'<input type="file" id="lgFile" accept="image/png,image/jpeg,image/webp"><span class="hint">Gambar otomatis diperkecil agar ringan disimpan.</span></div></article>';
  }
  function paintLogo(){
    $('#lgPrev').innerHTML=logo?'<img alt="Logo perpustakaan" src="'+esc(logo)+'">':'<span>Belum ada<br>logo</span>';
    $('#lgDel').style.display=logo?'':'none';
  }

  $('#fp').innerHTML=logoBox()+G.map(function(g){
    return'<article class="panel box"><h2>'+esc(g.t)+'</h2>'+(g.src?'<div class="srcrow"><span id="srcTxt" role="status"></span><button type="button" class="btn alt sm" id="srcBtn">Muat ulang</button></div>':'<p class="sub">'+esc(g.s)+'</p>')+'<div class="g">'+g.f.map(field).join('')+'</div></article>';
  }).join('')+'<div style="display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap"><button type="submit" class="btn">Simpan profil</button></div>';
  paintLogo();

  /* ===== TARIK DATA DARI SUPABASE ===== */
  var RO=ALL.filter(function(f){return f.ro});
  function stat(t,bad){var e=$('#srcTxt');e.textContent=t;e.style.color=bad?'var(--wine)':''}
  function pull(){
    var b=$('#srcBtn');b.disabled=true;stat('Mengambil data dari tabel profil…');
    fetch(SB+'profil?select=*&limit=1',{headers:HD})
      .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
      .then(function(rows){
        var r=rows&&rows[0];
        if(!r){stat('Tabel profil masih kosong.',1);return}
        RO.forEach(function(f){var v=r[f.k]==null?'':String(r[f.k]);$('#p_'+f.k).value=v;D[f.k]=v});
        save();stat('Data diambil dari tabel profil (Supabase).');
      })
      .catch(function(e){stat('Gagal mengambil data ('+e.message+'). '+(D.nama_sekolah?'Menampilkan data tersimpan terakhir.':'Periksa koneksi lalu coba lagi.'),1)})
      .then(function(){b.disabled=false});
  }
  /* Muat profil_perpustakaan (data perpustakaan, akun, logo), lalu segarkan data sekolah dari tabel profil */
  function loadRemote(){
    return fetch(SB+TB+'?select=*&order=created_at.asc&limit=1',{headers:HD})
      .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
      .then(function(rows){
        var r=rows&&rows[0];if(!r)return;
        ALL.forEach(function(f){if(r[f.k]!=null){D[f.k]=String(r[f.k]);$('#p_'+f.k).value=D[f.k]}});
        D.id=r.id;if(r.logo){logo=r.logo;D.logo=logo;paintLogo()}
        save();$('#navName').textContent=D.nama_perpustakaan||'PustakaGO';
      })
      .catch(function(e){toast('Gagal memuat profil_perpustakaan ('+e.message+'). Menampilkan data tersimpan di browser.')});
  }
  $('#srcBtn').addEventListener('click',pull);
  loadRemote().then(pull);

  /* ===== LOGO ===== */
  var dirty=false;
  $('#lgPick').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();$('#lgFile').click()}});
  $('#lgDel').addEventListener('click',function(){logo='';logoBlob=null;dirty=true;$('#lgFile').value='';paintLogo()});
  $('#lgFile').addEventListener('change',function(){
    var fl=this.files[0];if(!fl)return;
    if(!/^image\//.test(fl.type))return toast('File harus berupa gambar.');
    if(fl.size>5*1024*1024)return toast('Ukuran gambar maksimal 5 MB.');
    var rd=new FileReader();
    rd.onerror=function(){toast('Gagal membaca gambar.')};
    rd.onload=function(){
      var im=new Image();
      im.onerror=function(){toast('Gambar tidak dapat dibuka.')};
      im.onload=function(){
        var M=320,r=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(im.width*r));c.height=Math.max(1,Math.round(im.height*r));
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        logo=c.toDataURL('image/png');c.toBlob(function(b){logoBlob=b},'image/png');dirty=true;paintLogo();
      };
      im.src=rd.result;
    };
    rd.readAsDataURL(fl);
  });

  /* ===== PASSWORD ===== */
  $('#tgl').addEventListener('click',function(){
    var i=$('#p_password'),on=i.type==='password';
    i.type=on?'text':'password';this.textContent=on?'Sembunyi':'Lihat';
    this.setAttribute('aria-pressed',on?'true':'false');this.setAttribute('aria-label',on?'Sembunyikan password':'Tampilkan password');
  });

  /* ===== SIMPAN ===== */
  function setErr(f,msg){var i=$('#p_'+f.k),e=$('#e_'+f.k);e.textContent=msg||'';if(msg)i.setAttribute('aria-invalid','true');else i.removeAttribute('aria-invalid')}
  $('#fp').addEventListener('input',function(e){dirty=true;var f=ALL.filter(function(x){return'p_'+x.k===e.target.id})[0];if(f)setErr(f,'')});
  $('#fp').addEventListener('change',function(){dirty=true});

  function submit(){
    var out={},bad=null;
    ALL.forEach(function(f){
      if(f.ro){out[f.k]=$('#p_'+f.k).value;return}
      var v=$('#p_'+f.k).value.trim(),msg='';
      if(f.pw)v=$('#p_'+f.k).value; /* password tidak dipotong spasi */
      if(f.req&&!v)msg='Kolom '+f.l+' wajib diisi.';
      else if(v&&f.re&&!f.re.test(v))msg=f.m;
      else if(v&&f.chk&&!f.chk(v))msg=f.m;
      setErr(f,msg);if(msg&&!bad)bad=f;
      out[f.k]=v;
    });
    if(bad){$('#p_'+bad.k).focus();return toast('Periksa kembali kolom yang ditandai.')}
    D=Object.assign({},D,out,{id:D.id||uuid(),logo:logo});
    save();$('#navName').textContent=D.nama_perpustakaan||'PustakaGO';
    var bs=document.querySelectorAll('button[type=submit],#dSimpan');bs.forEach(function(b){b.disabled=true});
    upLogo().then(upsert).then(function(){dirty=false;toast('Profil disimpan.')})
      .catch(function(e){toast('Tersimpan di browser, tetapi gagal ke Supabase ('+e.message+').')})
      .then(function(){bs.forEach(function(b){b.disabled=false})});
  }
  function upLogo(){
    if(!logoBlob)return Promise.resolve();
    var path='logo-perpustakaan/'+D.id+'-'+Date.now()+'.png';
    return fetch(SU+'object/aset/'+path,{method:'POST',headers:Object.assign({'Content-Type':'image/png','x-upsert':'true'},HD),body:logoBlob})
      .then(function(r){if(!r.ok)throw new Error('upload logo HTTP '+r.status);
        logo=SU+'object/public/aset/'+path;D.logo=logo;logoBlob=null;paintLogo();save()});
  }
  function upsert(){
    var rec={id:D.id,logo:D.logo||''};ALL.forEach(function(f){rec[f.k]=D[f.k]||''});
    return fetch(SB+TB+'?on_conflict=id',{method:'POST',headers:Object.assign({'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},HD),body:JSON.stringify(rec)})
      .then(function(r){if(!r.ok)return r.text().then(function(t){var m='';try{m=JSON.parse(t).message}catch(e){}throw new Error('HTTP '+r.status+(m?': '+m:''))})});
  }
  $('#fp').addEventListener('submit',function(e){e.preventDefault();submit()});
  $('#dSimpan').addEventListener('click',submit);

  /* ===== NAVIGASI ===== */
  function leave(url){if(dirty&&!confirm('Perubahan belum disimpan. Tinggalkan halaman ini?'))return;dirty=false;location.href=url}
  $('#home').addEventListener('click',function(){leave('adminpustakawan.html')});
  $('#dBeranda').addEventListener('click',function(){leave('adminpustakawan.html')});
  window.addEventListener('beforeunload',function(e){if(dirty){e.preventDefault();e.returnValue=''}});

  try{var u=JSON.parse(sessionStorage.getItem('pustakago_user')),n=u&&(u.nama||u.username);if(n){$('#who').textContent=n;$('#av').textContent=n.trim().split(/\s+/).slice(0,2).map(function(w){return w[0]}).join('').toUpperCase()}}catch(e){}
  $('#navName').textContent=D.nama_perpustakaan||'PustakaGO';
})();
</script>
</body>
</html>
